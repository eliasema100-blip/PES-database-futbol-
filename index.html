<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base de Datos de Fútbol</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f3f5;
            color: #222;
        }

        header {
            background: #111827;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        header p {
            margin: 8px 0 0;
            color: #cbd5e1;
        }

        .contenedor {
            max-width: 1000px;
            margin: 25px auto;
            padding: 0 15px;
        }

        .buscador {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }

        .buscador input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        .jugador {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .jugador h2 {
            margin-top: 0;
            color: #111827;
        }

        .dato {
            margin: 8px 0;
        }

        .dato strong {
            display: inline-block;
            width: 150px;
        }

        .posicion {
            display: inline-block;
            background: #e5e7eb;
            padding: 5px 10px;
            border-radius: 6px;
            font-weight: bold;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #666;
        }
    </style>
</head>

<body>

<header>
    <h1>Base de Datos de Fútbol</h1>
    <p>Información de jugadores y equipos</p>
</header>

<div class="contenedor">

    <div class="buscador">
        <input
            type="text"
            id="buscador"
            placeholder="Buscar jugador..."
            onkeyup="buscarJugador()"
        >
    </div>

    <div id="listaJugadores">

        <div class="jugador">
            <h2>Erling Haaland</h2>

            <div class="dato">
                <strong>Club:</strong>
                Manchester City FC
            </div>

            <div class="dato">
                <strong>Nombre:</strong>
                Erling Haaland
            </div>

            <div class="dato">
                <strong>Nombre de camiseta:</strong>
                HAALAND
            </div>

            <div class="dato">
                <strong>Número:</strong>
                9
            </div>

            <div class="dato">
                <strong>Posición:</strong>
                <span class="posicion">CD ★</span>
            </div>

            <div class="dato">
                <strong>Nacionalidad:</strong>
                Noruega
            </div>

            <div class="dato">
                <strong>Edad:</strong>
                26 años
            </div>

            <div class="dato">
                <strong>Fecha de nacimiento:</strong>
                21/07/2000
            </div>

            <div class="dato">
                <strong>Altura:</strong>
                195 cm
            </div>

            <div class="dato">
                <strong>Peso:</strong>
                94 kg
            </div>
        </div>

    </div>
</div>

<footer>
    Base de Datos de Fútbol
</footer>

<script>
    function buscarJugador() {
        let texto = document
            .getElementById("buscador")
            .value
            .toLowerCase();

        let jugadores = document.querySelectorAll(".jugador");

        jugadores.forEach(function(jugador) {
            let contenido = jugador.textContent.toLowerCase();

            if (contenido.includes(texto)) {
                jugador.style.display = "block";
            } else {
                jugador.style.display = "none";
            }
        });
    }
</script>

</body>
</html>
